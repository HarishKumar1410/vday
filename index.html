<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        /* Starry Background */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: transparent;
        }

        /* Initial Gift View */
        #gift-container {
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #gift-container:hover {
            transform: scale(1.1) rotate(5deg);
        }
        .gift-box {
            font-size: 80px;
            animation: bounce 2s infinite;
        }
        .instruction {
            font-size: 1.2rem;
            margin-top: 20px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        /* Main Content (Hidden Initially) */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 2s ease-in;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ff9a9e;
            text-shadow: 0 0 10px rgba(255, 154, 158, 0.8);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 40px;
        }

        /* Interactive Message Generator */
        .message-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #dynamic-message {
            font-size: 1.5rem;
            font-style: italic;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.surprise-btn {
            background: #ff9a9e;
            color: #2c5364;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.4);
        }

        button.surprise-btn:hover {
            background: #fecfef;
            transform: translateY(-2px);
        }

        /* Floating Hearts Animation */
        .heart {
            position: absolute;
            font-size: 24px;
            color: #ff9a9e;
            animation: floatUp 4s linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Starry Background Generator -->
    <script>
        const stars = document.createElement('div');
        stars.className = 'stars';
        document.body.appendChild(stars);
        for(let i=0; i<100; i++) {
            let star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.backgroundColor = 'white';
            star.style.borderRadius = '50%';
            star.style.opacity = Math.random();
            star.style.animation = `twinkle ${Math.random() * 3 + 2}s infinite alternate`;
            stars.appendChild(star);
        }
    </script>
    <style>
        @keyframes twinkle { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>

    <!-- The Gift Reveal -->
    <div id="gift-container" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <div class="instruction">Tap to open your surprise...</div>
    </div>

    <!-- The Main Website -->
    <div id="main-content">
        <h1>Happy Birthday, Darling!</h1>
        <p class="subtitle">Even though we are miles apart, we share the same stars tonight.</p>
        
        <div class="message-box">
            <h3>Why I Love You</h3>
            <div id="dynamic-message">Click the button below to see a reason...</div>
            <button class="surprise-btn" onclick="generateMessage()">Tell me another reason ❤️</button>
        </div>
    </div>

    <script>
        // Personalize these messages for her!
        const messages = [
            "Your smile is my favorite thing in the world.",
            "I can't wait to build our future together—a beautiful, modern one.",
            "Distance means so little when you mean so much.",
            "My love for you is unconditional, no complex logic or 'while' loops required.",
            "You make every single day brighter.",
            "I am so proud of everything you do.",
            "Counting down the days until I can finally hug you again."
        ];

        function openGift() {
            document.getElementById('gift-container').style.display = 'none';
            const mainContent = document.getElementById('main-content');
            mainContent.style.display = 'block';
            
            // Trigger a fade in
            setTimeout(() => {
                mainContent.style.opacity = 1;
            }, 100);

            // Create initial burst of hearts
            for(let i=0; i<15; i++) {
                setTimeout(createHeart, i * 150);
            }
            
            generateMessage();
        }

        function generateMessage() {
            const msgElement = document.getElementById('dynamic-message');
            // Fade out
            msgElement.style.opacity = 0;
            
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * messages.length);
                msgElement.innerText = `"${messages[randomIndex]}"`;
                // Fade in
                msgElement.style.opacity = 1;
                msgElement.style.transition = "opacity 0.5s";
            }, 300);

            createHeart();
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-20px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
    </script>
</body>
</html>
